<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Document</title>
<link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<h1>Books</h1>

<form th:action="@{/books}" th:object="${book}" method="post">
    <label>Title: <input type="text" th:field="*{title}"></label>
    <label>Author: <input type="text" th:field="*{author}"></label>
    <label>Year: <input type="text" th:field="*{year}"></label>
    <label>ISBN: <input type="text" th:field="*{isbn}"></label>
    <button type="submit">Add book</button>

</form>

<h2>Book List</h2>
<ul>
    <li th:each="book: ${books}">
        <span th:text="${book.title}"></span> by
        <span th:text="${book.author}"></span>,
        <span th:text="${book.year}"></span> - ISBN
        <span th:text="${book.isbn}"></span>
    </li>
</ul>
</body>
</html>
